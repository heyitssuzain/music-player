name: AURA Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Android App Bundle (.aab)'
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r27c
          build-tools: 36.0.0
          cmake-version: 3.22.1

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -keystore debug.keystore -storepass android -keypass android -storetype jks
          echo "Debug keystore generated successfully"
          file debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Android App Bundle (.aab)
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Fix APK Permissions
        run: |
          chmod 644 app/build/outputs/apk/release/*.apk || true
          ls -lh app/build/outputs/apk/release/ || true
          chmod 644 app/build/outputs/bundle/release/*.aab || true
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release Bundle
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn