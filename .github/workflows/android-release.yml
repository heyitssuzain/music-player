name: AURA Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Android App Bundle (.aab)'
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create .env file for secrets plugin
        run: |
          cat > .env << 'EOF'
          # Local environment variables for AURA Music Player
          # This file is generated by CI for release builds
          YOUTUBE_API_KEY=dummy_key
          SPOTIFY_CLIENT_ID=dummy_client_id
          SPOTIFY_CLIENT_SECRET=dummy_client_secret
          STORE_PASSWORD=android
          KEY_PASSWORD=android
          KEYSTORE_PATH=debug.keystore
          EOF

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -keystore debug.keystore -storepass android -keypass android -storetype jks
          echo "Debug keystore generated successfully"
          file debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Android App Bundle (.aab)
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Verify Release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
            exit 1
          fi
          echo "Release APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          unzip -l "$APK_PATH" | head -20
          if command -v aapt &> /dev/null; then
            aapt dump badging "$APK_PATH" | grep package
          elif command -v apkanalyzer &> /dev/null; then
            apkanalyzer manifest application-id "$APK_PATH"
          fi
          sha256sum "$APK_PATH"

      - name: Verify Release Bundle
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: Release AAB not found at $AAB_PATH"
            find app/build/outputs -name "*.aab" -type f 2>/dev/null || echo "No AAB files found anywhere"
            exit 1
          fi
          echo "Release AAB found: $AAB_PATH"
          ls -lh "$AAB_PATH"
          sha256sum "$AAB_PATH"

      - name: Fix APK Permissions
        run: |
          chmod 644 app/build/outputs/apk/release/*.apk || true
          ls -lh app/build/outputs/apk/release/ || true
          chmod 644 app/build/outputs/bundle/release/*.aab || true
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release Bundle
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error