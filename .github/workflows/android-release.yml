name: AURA Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Android App Bundle (.aab)'
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -keystore debug.keystore \
            -storepass android -keypass android -storetype jks
          echo "Debug keystore generated"
          ls -la debug.keystore

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --no-configuration-cache

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Verify Release APK
        run: |
          echo "=== Verifying Release APK Artifacts ==="
          ls -lh app/build/outputs/apk/release/ || true

      - name: Build Android App Bundle (.aab)
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        run: gradle bundleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release Bundle
        if: ${{ inputs.build_bundle || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
