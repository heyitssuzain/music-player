name: AURA Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keystore debug.keystore \
              -storepass android \
              -keypass android
            echo "Debug keystore generated successfully"
          else
            echo "Debug keystore already exists"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --no-configuration-cache

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Verify Debug APK
        run: |
          echo "=== Verifying Debug APK Artifact ==="
          ls -lh app/build/outputs/apk/debug/
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            FILESIZE=$(stat -c%s "$APK_FILE")
            echo "Debug APK found: $APK_FILE ($FILESIZE bytes)"
          else
            echo "ERROR: Debug APK not found at $APK_FILE"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
