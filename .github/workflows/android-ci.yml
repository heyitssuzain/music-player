name: AURA Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create .env file for secrets plugin
        run: |
          cat > .env << 'EOF'
          # Local environment variables for AURA Music Player
          # This file is generated by CI for debug builds
          YOUTUBE_API_KEY=dummy_key
          SPOTIFY_CLIENT_ID=dummy_client_id
          SPOTIFY_CLIENT_SECRET=dummy_client_secret
          STORE_PASSWORD=android
          KEY_PASSWORD=android
          KEYSTORE_PATH=debug.keystore
          EOF

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -keystore debug.keystore -storepass android -keypass android -storetype jks
          echo "Debug keystore generated successfully"
          ls -la debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Find and Verify APK
        run: |
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found anywhere"
            find . -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error