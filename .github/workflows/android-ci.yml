name: AURA Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create .env file for secrets plugin
        run: |
          cat > .env << 'EOF'
          # Local environment variables for AURA Music Player
          # This file is generated by CI for debug builds
          YOUTUBE_API_KEY=dummy_key
          SPOTIFY_CLIENT_ID=dummy_client_id
          SPOTIFY_CLIENT_SECRET=dummy_client_secret
          STORE_PASSWORD=android
          KEY_PASSWORD=android
          KEYSTORE_PATH=debug.keystore
          EOF

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -keystore debug.keystore -storepass android -keypass android -storetype jks
          echo "Debug keystore generated successfully"
          ls -la debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
            exit 1
          fi
          echo "APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          unzip -l "$APK_PATH" | head -20
          if command -v aapt &> /dev/null; then
            aapt dump badging "$APK_PATH" | grep package
          elif command -v apkanalyzer &> /dev/null; then
            apkanalyzer manifest application-id "$APK_PATH"
          fi
          sha256sum "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error