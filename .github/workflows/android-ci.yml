name: AURA Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK
        run: |
          echo "=== Verifying Debug APK Artifact ==="
          ls -lh app/build/outputs/apk/debug/
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            FILESIZE=$(stat -c%s "$APK_FILE")
            echo "Debug APK found: $APK_FILE ($FILESIZE bytes)"
          else
            echo "ERROR: Debug APK not found at $APK_FILE"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
